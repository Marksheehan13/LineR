<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LineR{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('liner.static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('liner.upload_form') }}">LineR</a>
    <nav>
      <a href="{{ url_for('liner.upload_form') }}">Upload</a>
      <a href="{{ url_for('liner.rows') }}">Coded rows</a>
    </nav>
    <span class="demo">Prototype: synthetic documents only. Do not upload real client documents.</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
