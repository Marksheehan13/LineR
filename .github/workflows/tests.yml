name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract, Poppler and a font for the sample documents
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Lint (unused imports, undefined names, syntax errors)
        run: |
          pip install ruff
          ruff check .
      - name: Run all tests with a coverage report
        run: |
          pip install pytest-cov
          python -m pytest -q --cov=liner --cov-report=term-missing
